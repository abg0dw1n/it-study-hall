# Supabase pauses free projects after about a week without activity.
# This makes one small database read twice a week so sign-in keeps working.
name: Keep Supabase active

on:
  schedule:
    - cron: '17 13 * * 1,4'   # Mondays and Thursdays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the public API
        env:
          SB_URL: https://rbywonfaduuhsnzxrmgr.supabase.co
          SB_KEY: sb_publishable_SeSN5dU6RLpAYOc7o60CJA_ePJMgEOq   # publishable key; data is protected by RLS
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            "$SB_URL/rest/v1/question_reports?select=id&limit=1" \
            -H "apikey: $SB_KEY")
          echo "HTTP $code: $(cat /tmp/body)"
          test "$code" = "200"
